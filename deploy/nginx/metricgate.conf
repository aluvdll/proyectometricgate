server {
    listen 80;
    server_name metricgate.es www.metricgate.es;
    return 301 https://www.metricgate.es$request_uri;
}

server {
    listen 443 ssl http2;
    server_name metricgate.es;

    ssl_certificate /etc/nginx/ssl/metricgate.crt;
    ssl_certificate_key /etc/nginx/ssl/metricgate.key;

    return 301 https://www.metricgate.es$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.metricgate.es;

    ssl_certificate /etc/nginx/ssl/metricgate.crt;
    ssl_certificate_key /etc/nginx/ssl/metricgate.key;

    root /var/www/proyectometricgate/frontend/dist;
    index index.html;

    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

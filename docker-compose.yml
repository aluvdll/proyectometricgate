services:
  mysql:
    image: mysql:8.4
    container_name: metricgates-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backendApi/Dockerfile
    container_name: metricgates-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - backendApi/.env
    volumes:
      - ./backendApi:/var/www/backendApi
    networks:
      - metricgates

  api-nginx:
    image: nginx:1.27-alpine
    container_name: metricgates-api-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backendApi:/var/www/backendApi
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - metricgates

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: metricgates-frontend
    restart: unless-stopped
    depends_on:
      - api-nginx
    networks:
      - metricgates

  edge-nginx:
    image: nginx:1.27-alpine
    container_name: metricgates-edge-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - api-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - metricgates

  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: metricgates-dns
    restart: unless-stopped
    profiles:
      - lan-dns
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./dns/bind/named.conf:/etc/bind/named.conf:ro
      - ./dns/bind/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/bind/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/bind/zones:/etc/bind/zones:ro
    networks:
      - metricgates

volumes:
  mysql_data:

networks:
  metricgates:
    driver: bridge
